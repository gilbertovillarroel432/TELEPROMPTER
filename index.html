<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinePrompter - Teleprompter Cinematográfico</title>
  
  <!-- Tailwind CSS, React y Babel -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Montserrat:wght@400;600;700;900&family=Special+Elite&display=swap" rel="stylesheet">

  <style>
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-sans { font-family: 'Montserrat', sans-serif; }
    .font-jmh { font-family: 'Special Elite', monospace; }

    .bg-cinema {
      background: radial-gradient(circle at 50% -20%, #1e1b2e 0%, #090a0f 70%, #030407 100%);
    }

    .cinema-card {
      background: rgba(15, 17, 23, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(212, 175, 55, 0.15);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
    }

    .gold-gradient-text {
      background: linear-gradient(135deg, #fff 0%, #fef08a 40%, #eab308 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Animación del Toast */
    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-toast {
      animation: toastIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-cinema text-slate-100 min-h-screen selection:bg-amber-500 selection:text-black font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function LandingPage() {
      const [toast, setToast] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);

      const triggerToast = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Manejador del formulario Formspree
      const handleSubmit = async (e) => {
        e.preventDefault();
        setIsSubmitting(true);
        const form = e.target;

        try {
          // Reemplaza la URL a continuación cuando tengas tu ID de Formspree
          const response = await fetch("https://formspree.io/f/TU_FORMSPREE_ID", {
            method: "POST",
            body: new FormData(form),
            headers: { 'Accept': 'application/json' }
          });

          if (response.ok) {
            triggerToast("¡Mensaje enviado con éxito! Me pondré en contacto pronto.", "success");
            form.reset();
          } else {
            triggerToast("Aún no has configurado el ID de Formspree.", "warning");
          }
        } catch (error) {
          triggerToast("Ocurrió un error al enviar el mensaje. Inténtalo de nuevo.", "warning");
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* COMPONENTE TOAST ANIMADO */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 animate-toast">
              <div className="cinema-card border-l-4 border-l-amber-500 rounded-2xl px-5 py-3.5 flex items-center gap-3 shadow-2xl backdrop-blur-xl bg-slate-950/90 text-xs font-sans">
                <span className="text-base">
                  {toast.type === 'warning' ? '⚠️' : toast.type === 'success' ? '🎬' : 'ℹ️'}
                </span>
                <span className="text-amber-100 font-medium tracking-wide">
                  {toast.message}
                </span>
              </div>
            </div>
          )}

          {/* NAVEGACIÓN SUPERIOR */}
          <header className="border-b border-amber-500/10 cinema-card sticky top-0 z-40">
            <div className="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 font-bold text-base shadow-lg shadow-amber-500/10">
                  🎬
                </div>
                <span className="font-cinzel font-bold text-lg tracking-widest text-amber-100 uppercase">
                  CinePrompter
                </span>
              </div>

              <a
                href="teleprompter.html"
                className="bg-amber-500 hover:bg-amber-400 text-black font-bold px-6 py-2.5 rounded-xl text-xs uppercase tracking-wider transition shadow-lg shadow-amber-500/20 hover:scale-105 transform duration-200"
              >
                ¡Comencemos! 🚀
              </a>
            </div>
          </header>

          {/* HERO SECTION */}
          <section className="max-w-5xl mx-auto px-6 py-20 text-center space-y-8">
            <div className="inline-block border border-amber-500/30 bg-amber-500/10 px-4 py-1.5 rounded-full text-amber-300 text-xs tracking-widest uppercase font-semibold">
              Reinventando la lectura en cámara
            </div>

            <h1 className="text-4xl md:text-6xl font-cinzel font-bold leading-tight gold-gradient-text max-w-4xl mx-auto">
              La experiencia de lectura definitiva para creadores de contenido y cineastas
            </h1>

            <p className="text-slate-400 text-base md:text-lg max-w-2xl mx-auto leading-relaxed">
              Diseñado para eliminar la rigidez de los teleprompters tradicionales. Ritmo dinámico, múltiples modos de lectura animada y tipografías cinemáticas para potenciar tu presencia en cámara.
            </p>

            <div className="pt-4 flex flex-col sm:flex-row items-center justify-center gap-4">
              <a
                href="teleprompter.html"
                className="w-full sm:w-auto bg-amber-500 hover:bg-amber-400 text-black font-extrabold px-10 py-4 rounded-2xl text-sm uppercase tracking-widest transition shadow-2xl shadow-amber-500/30 hover:scale-105 transform duration-200"
              >
                ¡Comencemos Ahora!
              </a>
              <a
                href="#concepto"
                className="w-full sm:w-auto cinema-card hover:bg-slate-900/80 text-amber-100 font-semibold px-8 py-4 rounded-2xl text-sm tracking-wider transition border border-amber-500/20"
              >
                Conocer el Concepto
              </a>
            </div>
          </section>

          {/* SECCIÓN DEL CONCEPTO Y CARACTERÍSTICAS */}
          <section id="concepto" className="max-w-6xl mx-auto px-6 py-16 w-full">
            <div className="text-center mb-12 space-y-2">
              <h2 className="text-2xl md:text-3xl font-cinzel font-bold text-amber-100">
                ¿Por qué CinePrompter?
              </h2>
              <p className="text-slate-400 text-sm">
                Diseñado desde la perspectiva del orador, no solo de la pantalla.
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              
              <div className="cinema-card p-8 rounded-3xl space-y-4 hover:border-amber-500/40 transition">
                <div className="w-12 h-12 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 text-2xl">
                  ⌨️
                </div>
                <h3 className="font-bold text-lg text-amber-100">Lectura Adaptativa</h3>
                <p className="text-slate-400 text-xs leading-relaxed">
                  Cambia sobre la marcha entre animación estilo máquina de escribir, resaltado palabra por palabra o bloques de texto completo según la fluidez de tu toma.
                </p>
              </div>

              <div className="cinema-card p-8 rounded-3xl space-y-4 hover:border-amber-500/40 transition">
                <div className="w-12 h-12 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 text-2xl">
                  📄
                </div>
                <h3 className="font-bold text-lg text-amber-100">Lienzo Continuo + Bloques</h3>
                <p className="text-slate-400 text-xs leading-relaxed">
                  Escribe tu guión como una hoja libre y convierte cualquier selección en bloques de lectura independientes con un solo clic.
                </p>
              </div>

              <div className="cinema-card p-8 rounded-3xl space-y-4 hover:border-amber-500/40 transition">
                <div className="w-12 h-12 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 text-2xl">
                  🔒
                </div>
                <h3 className="font-bold text-lg text-amber-100">Persistencia & Wake Lock</h3>
                <p className="text-slate-400 text-xs leading-relaxed">
                  Tu contenido se guarda automáticamente en tu navegador. La pantalla permanecerá encendida durante todo el proceso de rodaje.
                </p>
              </div>

            </div>
          </section>

          {/* SECCIÓN SOBRE EL CREADOR */}
          <section className="max-w-4xl mx-auto px-6 py-16 w-full">
            <div className="cinema-card rounded-3xl p-8 md:p-12 relative overflow-hidden border-amber-500/20">
              <div className="flex flex-col md:flex-row items-center gap-8">
                
                {/* AVATAR / AVATAR PLACEHOLDER */}
                <div className="w-28 h-28 md:w-36 md:h-36 rounded-full bg-slate-900 border-2 border-amber-500/40 flex items-center justify-center shrink-0 shadow-2xl relative">
                  <span className="text-4xl md:text-5xl">📽️</span>
                </div>

                <div className="space-y-3 text-center md:text-left">
                  <span className="text-amber-400 text-xs font-semibold tracking-widest uppercase">
                    El Creador
                  </span>
                  <h3 className="text-2xl font-cinzel font-bold text-amber-100">
                    Construido para Creadores Exigentes
                  </h3>
                  <p className="text-slate-400 text-xs leading-relaxed">
                    Hola, soy el desarrollador detrás de CinePrompter. Esta herramienta nació de la necesidad de contar con una plataforma intuitiva, elegante y enfocada en la estética audiovisual para agilizar la producción de contenido y la grabación de guiones cinematográficos.
                  </p>
                </div>

              </div>
            </div>
          </section>

          {/* SECCIÓN DE CONTACTO (FORMSPREE) */}
          <section className="max-w-2xl mx-auto px-6 py-16 w-full">
            <div className="cinema-card rounded-3xl p-8 space-y-6">
              <div className="text-center space-y-2">
                <h2 className="text-2xl font-cinzel font-bold text-amber-100">
                  Contacto & Sugerencias
                </h2>
                <p className="text-slate-400 text-xs">
                  ¿Tienes sugerencias o quieres colaborar? Envíame un mensaje.
                </p>
              </div>

              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1.5">Nombre</label>
                  <input
                    type="text"
                    name="name"
                    required
                    placeholder="Tu nombre o estudio"
                    className="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-amber-500 transition"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1.5">Correo Electrónico</label>
                  <input
                    type="email"
                    name="email"
                    required
                    placeholder="tu@email.com"
                    className="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-amber-500 transition"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1.5">Mensaje</label>
                  <textarea
                    name="message"
                    required
                    rows="4"
                    placeholder="Escribe tu mensaje aquí..."
                    className="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-amber-500 transition resize-y"
                  ></textarea>
                </div>

                <button
                  type="submit"
                  disabled={isSubmitting}
                  className="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider transition shadow-lg shadow-amber-500/20"
                >
                  {isSubmitting ? "Enviando..." : "Enviar Mensaje 📬"}
                </button>
              </form>
            </div>
          </section>

          {/* PIE DE PÁGINA */}
          <footer className="border-t border-slate-800/80 py-8 text-center text-xs text-slate-500">
            <p>© {new Date().getFullYear()} CinePrompter. Todos los derechos reservados.</p>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<LandingPage />);
  </script>
</body>
</html>
